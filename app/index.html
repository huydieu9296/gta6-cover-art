<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Panels — GTA-style cover maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Vice Panels</h1>
    <p class="tag">Your photos, turned into a GTA-style multi-panel cover. Everything runs offline — photos never leave this machine.</p>

    <h2>Photos</h2>
    <div id="slots"></div>

    <h2>Panels</h2>
    <div id="panels"></div>

    <h2>Words</h2>
    <label>Caption <input id="caption" type="text" maxlength="40" value="VICE HEIST"></label>
    <label>Subtitle <input id="subtitle" type="text" maxlength="48" value="WELCOME TO VICE CITY"></label>

    <h2>Colour grade</h2>
    <div id="grades" class="chips"></div>

    <h2>Layout</h2>
    <label>Panels
      <select id="layout">
        <option value="trio" selected>3 panels</option>
        <option value="duo">2 panels</option>
      </select>
    </label>

    <h2>Export size</h2>
    <div id="sizes" class="chips"></div>

    <button id="export" type="button">Export PNG</button>
    <p id="sizeLabel" class="meta" role="status"></p>
    <p id="status" class="meta" role="status"></p>
  </section>
  <section class="preview" aria-label="Cover preview">
    <canvas id="cover" width="1920" height="1080" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
